# Freezes the model's top-3 pick before each race weekend's first graded session.
#
# Timing is NOT a "days before the race" heuristic. backend/scripts/due_snapshot.py
# resolves each race's real cutoff from Jolpica -- Sprint Qualifying on a sprint
# weekend, otherwise Qualifying -- and matches it to our raceIds by circuit, so a
# calendar revision or a round renumbering cannot silently shift the deadline.
# The list of races itself is derived from data/races.csv + results.csv; there is
# no per-race table to edit after a round.
#
# What went wrong before (2026-10-22 .. 10-31): the run reached the write step
# inside both the US GP and Mexico City GP windows and failed there on every
# attempt, so both cutoffs passed unsnapshotted and the MISSED alarm (issues #1,
# #2) was the only signal. The "workflow is green" badge was misleading: a run
# that ends in the alarm step succeeds. The changes below exist so that cannot
# happen quietly again:
#   * "Check Supabase access" (read-only) runs on EVERY tick, so a missing/wrong
#     secret fails the run (and opens an issue) days before any cutoff, not at it.
#   * any failed run opens ONE deduplicated issue (+ Discord if configured), and
#     the next green run closes it.
#   * the Render API is only woken when a write is actually due.
#   * pipeline-heartbeat.yml notices if this workflow stops running at all.
#
# The write is safe to repeat: snapshot_model_pick.py refuses to overwrite an
# existing snapshot unless --force is passed.

name: Snapshot model pick

on:
  schedule:
    # Every 30 minutes. GitHub's scheduler is best-effort (runs can start late or
    # be skipped under load), so we poll densely and let due_snapshot.py decide.
    # Idle ticks cost seconds and do not wake the API.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      race_id:
        description: "Force this raceId, ignoring the schedule window (its cutoff is still derived from Jolpica). Blank = the next upcoming race (dry run) or whatever is due."
        required: false
      dry_run:
        description: "DRY RUN (default ON): check Supabase access, then compute the pick and print it. Writes nothing. UNTICK to really write a snapshot."
        type: boolean
        default: true

concurrency:
  group: snapshot-model-pick
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  API_BASE: https://f1-predictor-api-m75n.onrender.com
  FAIL_TITLE: "Snapshot pipeline FAILING"

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --disable-pip-version-check requests

      # Fails loudly and specifically if SUPABASE_SECRET_KEY is missing, malformed,
      # a publishable key in the wrong slot, or cannot read the table. READ-ONLY:
      # one GET, no writes to production on any tick. Needs no API wake. (Write
      # grants are not probed -- a dry-run dispatch exercises everything but the
      # insert.)
      - name: Check Supabase access
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python backend/scripts/snapshot_model_pick.py --check-access

      # Always runs. Scheduled ticks: is a race inside its snapshot window? Manual
      # dispatch: a forced race_id (window ignored, but the cutoff is derived
      # from Jolpica exactly as for a scheduled run, so cutoff_at is always
      # recorded) or, for a dry run with no race_id, the next upcoming race.
      - name: Decide what is due
        id: due
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          RACE_ID_INPUT: ${{ github.event.inputs.race_id }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          if [ -n "$RACE_ID_INPUT" ]; then
            python backend/scripts/due_snapshot.py --season 2026 --race-id "$RACE_ID_INPUT"
          else
            if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
              echo "SUPABASE_PUBLISHABLE_KEY secret is not set (needed to read model_snapshots)"; exit 1
            fi
            NEXT=""
            if [ "$DRY_RUN_INPUT" = "true" ]; then NEXT="--next"; fi
            python backend/scripts/due_snapshot.py --season 2026 $NEXT
          fi

      - name: Resolve target
        id: target
        run: |
          echo "action=${{ steps.due.outputs.action }}"          >> "$GITHUB_OUTPUT"
          echo "race_id=${{ steps.due.outputs.race_id }}"        >> "$GITHUB_OUTPUT"
          echo "name=${{ steps.due.outputs.name }}"              >> "$GITHUB_OUTPUT"
          echo "cutoff=${{ steps.due.outputs.cutoff }}"          >> "$GITHUB_OUTPUT"
          echo "session=${{ steps.due.outputs.session }}"        >> "$GITHUB_OUTPUT"

      # Render's free plan spins the API down when idle. Wake it only when a
      # snapshot is actually about to be written.
      - name: Wake the model API
        if: steps.target.outputs.action == 'write'
        run: |
          for i in $(seq 1 12); do
            if curl -sf -m 25 "$API_BASE/" | grep -q '"models_ready":true'; then
              echo "API ready after ${i} attempt(s)"; exit 0
            fi
            sleep 15
          done
          echo "API did not become ready in time"; exit 1

      - name: Snapshot
        id: snap
        if: steps.target.outputs.action == 'write'
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -o pipefail
          DRY=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          CUT=""
          if [ -n "${{ steps.target.outputs.cutoff }}" ]; then CUT="--cutoff ${{ steps.target.outputs.cutoff }}"; fi
          python backend/scripts/snapshot_model_pick.py \
            --race-id "${{ steps.target.outputs.race_id }}" \
            --api-base "$API_BASE" $CUT $DRY 2>&1 | tee snap.log

      # Always runs, even after a failure: states which path this run took (due /
      # forced race_id / dry run / nothing due / missed) and whether anything was
      # written to production, so a run is never ambiguous.
      - name: Run summary
        if: always()
        env:
          EVENT: ${{ github.event_name }}
          INPUT_RACE_ID: ${{ github.event.inputs.race_id }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          ACTION: ${{ steps.target.outputs.action }}
          RACE_ID: ${{ steps.target.outputs.race_id }}
          RACE_NAME: ${{ steps.target.outputs.name }}
          CUTOFF: ${{ steps.target.outputs.cutoff }}
          SESSION: ${{ steps.target.outputs.session }}
          SNAP_OUTCOME: ${{ steps.snap.outcome }}
          SNAP_LOG: snap.log
        run: python backend/scripts/pipeline_summary.py >> "$GITHUB_STEP_SUMMARY"

      # Tells you what was frozen, so a pick you disagree with can still be
      # replaced with --force while the cutoff is ahead of you.
      - name: Report what was frozen
        if: success() && steps.target.outputs.action == 'write' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q "SKIPPED (exists)" snap.log; then echo "already frozen; not re-announcing"; exit 0; fi
          gh issue create \
            --title "Model snapshot frozen: ${{ steps.target.outputs.name }} (raceId ${{ steps.target.outputs.race_id }})" \
            --body "$(printf '%s\n' \
              "Cutoff (${{ steps.target.outputs.session }}): \`${{ steps.target.outputs.cutoff }}\`" \
              "" \
              '```' \
              "$(cat snap.log)" \
              '```' \
              "" \
              "To replace this pick before the cutoff:" \
              "" \
              '```' \
              "SUPABASE_SECRET_KEY=... python backend/scripts/snapshot_model_pick.py --race-id ${{ steps.target.outputs.race_id }} --api-base $API_BASE --force" \
              '```')"

      # A cutoff went past (or is <2h away) with no snapshot. Unrecoverable by
      # design -- a snapshot taken after the session would be a hindsight pick.
      - name: Alarm on a missed cutoff
        if: steps.target.outputs.action == 'missed'
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          TITLE="MISSED snapshot cutoff: ${{ steps.target.outputs.name }} (raceId ${{ steps.target.outputs.race_id }})"
          if [ -z "$(gh issue list --search "$TITLE" --state all --json number --jq '.[0].number')" ]; then
            gh issue create --title "$TITLE" --body "$(printf '%s\n' \
              "Cutoff \`${{ steps.target.outputs.cutoff }}\` (${{ steps.target.outputs.session }}) is within 2h or has passed and no snapshot exists for raceId ${{ steps.target.outputs.race_id }}." \
              "" \
              "Do not backfill this from /predict — after the session that endpoint sees the real grid, so the pick would be hindsight. Same situation as raceId 1180." \
              "" \
              "Leave the Model column empty for this race.")"
            if [ -n "$DISCORD_WEBHOOK_URL" ]; then
              curl -sf -H 'Content-Type: application/json' -d "{\"content\":\"$TITLE\"}" "$DISCORD_WEBHOOK_URL" || true
            fi
          fi

      - name: Nothing due
        if: steps.target.outputs.action == 'none'
        run: echo "No race inside the snapshot window. Nothing to do."

      # ── alerting ──────────────────────────────────────────────
      # One open issue while the pipeline is broken (not one per 30-minute tick).
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -z "$(gh issue list --search "$FAIL_TITLE in:title" --state open --json number --jq '.[0].number')" ]; then
            gh issue create --title "$FAIL_TITLE" --body "$(printf '%s\n' \
              "A run of the snapshot workflow failed: $RUN" \
              "" \
              "Open the failed step in that run. The common causes, in order: the \`SUPABASE_SECRET_KEY\` / \`SUPABASE_PUBLISHABLE_KEY\` Actions secrets (the 'Check Supabase access' step names exactly what is wrong), then the Render API not waking, then Jolpica being down." \
              "" \
              "This issue closes itself when a later run succeeds.")"
          fi
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -sf -H 'Content-Type: application/json' -d "{\"content\":\"$FAIL_TITLE — $RUN\"}" "$DISCORD_WEBHOOK_URL" || true
          fi

      - name: Close failure issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="$(gh issue list --search "$FAIL_TITLE in:title" --state open --json number --jq '.[0].number')"
          if [ -n "$n" ]; then
            gh issue close "$n" --comment "Recovered: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} succeeded."
          fi

      # Optional external dead-man's switch (e.g. healthchecks.io): if this ping
      # stops arriving, the external service alerts -- covering the case where
      # GitHub itself stops scheduling this workflow.
      - name: Ping external heartbeat
        if: success()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" >/dev/null; fi
